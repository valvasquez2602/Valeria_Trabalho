<body>


<div class="container mt-4">

  <h3 class="text-success mb-4">Minha Conta 👤</h3>

  <div class="card shadow p-4 mb-4">
    <h5 class="text-success"> Nível de Cuidador</h5>

    <p id="levelText">Nível: 1 🌱</p>

    <div class="progress mb-2">
      <div id="xpBar" class="progress-bar bg-success" style="width: 0%"></div>
    </div>

    <small id="xpText" class="text-muted">0 / 50 XP</small>
  </div>





  <div class="card shadow p-4 mb-4">

    <div class="text-center mb-3">
      <div class="profile-pic">🌱</div>
    </div>

    <label>Nome</label>
    <input type="text" id="name" class="form-control mb-2">

    <label>Email</label>
    <input type="email" id="email" class="form-control mb-2">

    <label>Bio</label>
    <textarea id="bio" class="form-control mb-3" rows="3"></textarea>

    <button class="btn btn-success w-100" onclick="saveProfile()">
      Salvar perfil
    </button>

  </div>

  <!-- PLANTAS -->
  <div class="card shadow p-4">

    <h5 class="text-success">🌿 Minhas Plantas</h5>

    <div class="input-group mb-3">
      <input type="text" id="plantInput" class="form-control" placeholder="Nome da planta...">
      <button class="btn btn-success" onclick="addPlant()">Adicionar</button>
    </div>

    <div id="plantList"></div>

  </div>

</div>

<script src="Js/conta.js"></script>
